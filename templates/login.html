<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Escon Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --primary: #0756C9;
            --secondary: #0B1F4B;
            --accent: #FF9D00;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; }
        body {
            min-height: 100vh;
            font-family: Segoe UI, Arial, sans-serif;
            background: linear-gradient(120deg, #ffffff 0%, #edf7ff 48%, #061a4c 100%);
        }
        .login-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .login-main {
            position: relative;
            z-index: 2;
            flex: 1;
            width: min(1450px, 100%);
            margin: auto;
            display: grid;
            grid-template-columns: minmax(350px, 1fr) minmax(320px, 420px);
            gap: 40px;
            align-items: center;
            padding: 30px;
        }
        .login-copy { max-width: 680px; }
        .brand-logo {
            font-size: 72px;
            font-weight: 950;
            color: var(--primary);
        }
        .brand-name {
            margin-top: 14px;
            font-size: 24px;
            font-weight: 800;
            color: var(--secondary);
        }
        .welcome h1 {
            margin: 40px 0 20px;
            font-size: 48px;
            line-height: 1.2;
            font-weight: 900;
        }
        .welcome h1 span { color: var(--primary); }
        .welcome p {
            font-size: 18px;
            line-height: 1.7;
            color: #596A82;
        }
        .login-card {
            position: relative;
            width: 100%;
            padding: 28px 24px;
            border-radius: 30px;
            background: linear-gradient(145deg, rgba(5,29,78,.97), rgba(2,18,55,.98));
            border: 1px solid rgba(94,163,255,.55);
            box-shadow: 0 30px 90px rgba(0,18,70,.45);
        }
        .login-card-content { position: relative; z-index: 2; }
        .login-card .brand-logo {
            text-align: center;
            font-size: 58px;
            color: #1268DD;
        }
        .login-card h2 {
            margin: 17px 0 8px;
            text-align: center;
            color: white;
            font-size: 30px;
            font-weight: 850;
        }
        .login-subtitle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin: 15px 0 32px;
            color: #82B7FF;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .form-label {
            color: #E9F2FF;
            font-weight: 700;
            margin-bottom: 9px;
        }
        .input-wrap {
            position: relative;
            margin-bottom: 23px;
        }
        .input-wrap > i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #7EA7D9;
            font-size: 18px;
            z-index: 3;
        }
        .input-wrap .toggle-password {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #7EA7D9;
        }
        .form-control {
            height: 59px;
            padding: 0 55px;
            border: 1px solid rgba(124,163,214,.40);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            background: rgba(255,255,255,.07);
        }
        .form-control::placeholder { color: rgba(211,226,246,.55); }
        .form-control:focus {
            color: white;
            background: rgba(255,255,255,.10);
            border-color: #318BFF;
            box-shadow: 0 0 0 4px rgba(49,139,255,.13);
            outline: none;
        }
        .password-input { padding-right: 55px; }
        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin: 5px 0 25px;
            color: #D2E2F7;
            font-size: 14px;
        }
        .login-options a {
            color: #69A9FF;
            text-decoration: none;
            font-weight: 700;
        }
        .login-btn {
            width: 100%;
            height: 52px;
            border: 0;
            border-radius: 13px;
            color: white;
            font-size: 18px;
            font-weight: 850;
            background: linear-gradient(100deg, #0875ED, #124FD0, #2634D8);
            box-shadow: 0 15px 35px rgba(0,93,235,.30);
            cursor: pointer;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(0,93,235,.40);
        }
        .secure-note {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 27px;
            padding-top: 23px;
            border-top: 1px solid rgba(154,186,225,.20);
            color: #8CA8CB;
            font-size: 13px;
            font-weight: 600;
        }
        .alert {
            border-radius: 10px;
            margin-bottom: 22px;
            font-size: 14px;
        }
        .login-footer {
            position: relative;
            z-index: 3;
            min-height: 70px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 25px;
            padding: 17px 55px;
            color: rgba(255,255,255,.82);
            background: linear-gradient(90deg, #020E31, #05215B, #020E31);
            border-top: 1px solid rgba(87,146,220,.25);
        }
        .footer-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            white-space: nowrap;
        }
        @media (max-width: 900px) {
            .login-main { grid-template-columns: 1fr; padding: 35px 20px; }
            .login-footer { grid-template-columns: 1fr; justify-items: center; }
        }
    </style>
</head>
<body>
<div class="login-shell">
    <main class="login-main">
        <section class="login-copy">
            <div class="brand-logo" style="text-align:center;">
                <img src="{{ url_for('static', filename='images/escon-revised-transparent.png') }}" alt="Escon Logo" style="max-width:420px;display:block;margin:0 auto 12px;">
            </div>
        </section>
        <section class="login-card">
            <div class="login-card-content">
                <div style="text-align:center;margin-bottom:12px;">
                    <img src="{{ url_for('static', filename='images/escon-revised-white-text.png') }}" alt="Escon Logo" style="max-width:360px;display:block;margin:0 auto;">
                </div>
                <div class="login-subtitle">User Login</div>
                <form action="/login" method="POST">
                    {% with messages = get_flashed_messages() %}
                    {% if messages %}
                    <div class="alert alert-danger text-center">
                        <i class="fa-solid fa-circle-exclamation me-2"></i>
                        {{ messages[0] }}
                    </div>
                    {% endif %}
                    {% endwith %}
                    <label class="form-label" for="username">Username</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter Username" autocomplete="username" autofocus required>
                    </div>
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" class="form-control password-input" id="password" name="password" placeholder="Enter Password" autocomplete="current-password" required>
                        <i class="fa-solid fa-eye toggle-password" id="togglePassword" title="Show / Hide Password"></i>
                    </div>
                    <div class="login-options">
                        <label><input type="checkbox" name="remember"> Remember Me</label>
                        <a href="#">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn login-btn">
                        <i class="fa-solid fa-right-to-bracket"></i> Login
                    </button>
                </form>
                <div class="secure-note">
                    <i class="fa-solid fa-shield-halved"></i>
                    Your data is safe and secure
                </div>
            </div>
        </section>
    </main>
    <footer class="login-footer">
        <div class="footer-item">&copy; 2026 Escon. All Rights Reserved.</div>
        <div class="footer-item"><i class="fa-solid fa-shield-halved"></i> Trusted. Reliable. Efficient.</div>
        <div class="footer-item"><i class="fa-solid fa-globe"></i> www.esconelevators.com</div>
    </footer>
</div>
<script>
    const togglePassword = document.getElementById("togglePassword");
    const password = document.getElementById("password");
    if (togglePassword && password) {
        togglePassword.addEventListener("click", function () {
            const type = password.getAttribute("type") === "password" ? "text" : "password";
            password.setAttribute("type", type);
            this.classList.toggle("fa-eye");
            this.classList.toggle("fa-eye-slash");
        });
    }
</script>
</body>
</html>
